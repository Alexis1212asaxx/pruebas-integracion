name: Python application

# Activar workflow al hacer push o pull request en main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest  

    steps:
    - uses: actions/checkout@v3  # Clonar el repositorio

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'  

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip  # Actualizar pip
        pip install -r requirements.txt     # Instalar librerías

    - name: Run tests
      run: |
        pytest -v  # Ejecutar pruebas unitarias con detalle
