name: Python application  # Nombre del workflow que aparecerá en GitHub Actions

on:
  push:
    branches: [ main ]  # Ejecutar workflow cuando haya push a main
  pull_request:
    branches: [ main ]  # Ejecutar workflow cuando se haga PR a main

jobs:
  build:

    runs-on: ubuntu-latest  # Máquina virtual donde correrá el workflow

    steps:
    - uses: actions/checkout@v3  # Clona el repositorio en la VM

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'  # Instala Python 3.11 en la VM

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip  # Actualiza pip a la última versión
        pip install -r requirements.txt      # Instala todas las librerías del proyecto

    - name: Run tests
      run: |
        pytest -v  # Ejecuta las pruebas unitarias y muestra detalles
